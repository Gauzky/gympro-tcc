<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadeMax - Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0c0e;
            --bg-card: #161719;
            --bg-input: #1f2024;
            --primary: #b5c7eb;
            --primary-glow: rgba(181, 199, 235, 0.2);
            --text-main: #f2f5f7;
            --text-muted: #6b6e76;
            --border: rgba(255, 255, 255, 0.08);
            --radius-md: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: radial-gradient(circle at top right, #1a1c20, #0b0c0e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .login-container { width: 100%; max-width: 400px; }

        .login-card {
            background: rgba(22, 23, 25, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .logo svg { height: 40px; width: 40px; }
        .logo-text { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .logo-ade { color: #f2f5f7; }
        .logo-max { color: #b5c7eb; }

        .input-group { margin-bottom: 15px; position: relative; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-group input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 15px 15px 15px 45px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            transition: 0.2s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn-primary {
            width: 100%;
            background: var(--primary);
            color: #0b0c0e;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); margin: 20px 0; font-size: 14px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        .google-btn-container { display: flex; justify-content: center; }
        .signup-link { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .signup-link a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- TELA DE LOGIN -->
        <div class="login-card" id="login-view">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.5714 12C20.5714 14.3457 19.6393 16.5942 17.9806 18.2529C16.3219 19.9116 14.0734 20.8437 11.7276 20.8437C9.38189 20.8437 7.13337 19.9116 5.47466 18.2529C3.81595 16.5942 2.88379 14.3457 2.88379 12" stroke="#b5c7eb" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M2.88379 12C2.88379 9.65428 3.81595 7.40576 5.47466 5.74705C7.13337 4.08834 9.38189 3.15619 11.7276 3.15619C14.0734 3.15619 16.3219 4.08834 17.9806 5.74705C19.6393 7.40576 20.5714 9.65428 20.5714 12" stroke="#f2f5f7" stroke-width="2.5" stroke-linecap="round"/>
                    <rect x="9.5" y="2" width="4" height="20" rx="2" fill="#b5c7eb"/>
                </svg>
                <div class="logo-text"><span class="logo-ade">ACADE</span><span class="logo-max">MAX</span></div>
            </div>

            <form onsubmit="fazerLogin(event)">
                <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" placeholder="Seu melhor e-mail" required></div>
                <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" placeholder="Sua senha" required></div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="divider">ou continue com</div>
            <div class="google-btn-container">
                <div id="g_id_onload" data-client_id="681505626161-vn9aiah8dd700qdsb4bolt9qanji49u1.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false"></div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="signin_with" data-shape="square"></div>
            </div>

            <div class="signup-link">Não tem uma conta? <a onclick="toggleAuthView('register')">Cadastre-se</a></div>
        </div>

        <!-- TELA DE CADASTRO -->
        <div class="login-card" id="register-view" style="display: none;">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.5714 12C20.5714 14.3457 19.6393 16.5942 17.9806 18.2529C16.3219 19.9116 14.0734 20.8437 11.7276 20.8437C9.38189 20.8437 7.13337 19.9116 5.47466 18.2529C3.81595 16.5942 2.88379 14.3457 2.88379 12" stroke="#b5c7eb" stroke-width="2.5" stroke-linecap="round"/><path d="M2.88379 12C2.88379 9.65428 3.81595 7.40576 5.47466 5.74705C7.13337 4.08834 9.38189 3.15619 11.7276 3.15619C14.0734 3.15619 16.3219 4.08834 17.9806 5.74705C19.6393 7.40576 20.5714 9.65428 20.5714 12" stroke="#f2f5f7" stroke-width="2.5" stroke-linecap="round"/><rect x="9.5" y="2" width="4" height="20" rx="2" fill="#b5c7eb"/></svg>
                <div class="logo-text"><span class="logo-ade">ACADE</span><span class="logo-max">MAX</span></div>
            </div>

            <form onsubmit="registrarUsuario(event)">
                <div class="input-group"><i class="fa-solid fa-user"></i><input type="text" id="reg-name" placeholder="Nome completo" required></div>
                <div class="input-group"><i class="fa-solid fa-envelope"></i><input type="email" id="reg-email" placeholder="Seu e-mail" required></div>
                <div class="input-group"><i class="fa-solid fa-cake-candles"></i><input type="date" id="reg-birthdate" required></div>
                <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="reg-password" placeholder="Crie uma senha" required></div>
                <div class="input-group"><i class="fa-solid fa-lock"></i><input type="password" id="reg-confirm-password" placeholder="Confirme sua senha" required></div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
            <div class="signup-link">Já tem uma conta? <a onclick="toggleAuthView('login')">Entrar</a></div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        
             const API = 'https://academax-backend.onrender.com/api';
        console.log("Script carregado. API configurada para:", API);
    
        function toggleAuthView(view) {
            console.log("Trocando para a view:", view);
            if (view === 'register') {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('register-view').style.display = 'block';
            } else {
                document.getElementById('login-view').style.display = 'block';
                document.getElementById('register-view').style.display = 'none';
            }
        }
    
        // GOOGLE
        function handleCredentialResponse(response) {
            console.log("✅ Google respondeu! Token recebido.");
            try {
                const data = JSON.parse(atob(response.credential.split('.')[1]));
                console.log("Dados do Google:", data);
                
                fetch(`${API}/google-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: data.name, email: data.email, picture: data.picture })
                })
                .then(res => {
                    console.log("Resposta do servidor (Google):", res.status);
                    return res.json();
                })
                .then(user => {
                    console.log("Usuário salvo:", user);
                    if(user.error) { alert(user.error); return; }
                    localStorage.setItem('gympro_user', JSON.stringify(user));
                    window.location.href = 'index.html';
                })
                .catch(err => {
                    console.error("Erro no fetch do Google:", err);
                    alert("Erro ao conectar no banco de dados (Google).");
                });
            } catch (error) {
                console.error("Erro ao processar Google:", error);
            }
        }
    
        // LOGIN NORMAL
        function fazerLogin(event) {
            event.preventDefault();
            console.log("Botão Entrar clicado!");
            const email = event.target.querySelector('input[type="email"]').value;
            const password = event.target.querySelector('input[type="password"]').value;
            
            console.log("Tentando logar com:", email);
            alert("Conectando ao servidor... Se demorar, o Render está acordando (demora 50s).");
    
            fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => {
                console.log("Resposta do servidor (Login):", res.status);
                return res.json();
            })
            .then(data => {
                console.log("Dados recebidos:", data);
                if (data.error) { alert(data.error); return; }
                localStorage.setItem('gympro_user', JSON.stringify(data));
                window.location.href = 'index.html';
            })
            .catch(err => {
                console.error("Erro no fetch do Login:", err);
                alert("Erro de conexão. Verifique se o link do Render está correto no código.");
            });
        }
    
        // CADASTRO
        function registrarUsuario(event) {
            event.preventDefault();
            console.log("Botão Cadastrar clicado!");
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const birthdate = document.getElementById('reg-birthdate').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
    
            if (password !== confirmPassword) { alert("As senhas não coincidem!"); return; }
    
            console.log("Enviando cadastro para o Render...");
            alert("Cadastrando... Se demorar, o Render está acordando (demora 50s).");
    
            fetch(`${API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, birthdate })
            })
            .then(res => {
                console.log("Resposta do servidor (Cadastro):", res.status);
                return res.json();
            })
            .then(data => {
                console.log("Dados recebidos:", data);
                if (data.error) { alert(data.error); return; }
                localStorage.setItem('gympro_user', JSON.stringify(data));
                alert("Cadastro realizado com sucesso!");
                window.location.href = 'index.html';
            })
            .catch(err => {
                console.error("Erro no fetch do Cadastro:", err);
                alert("Erro de conexão. Verifique se o link do Render está correto no código.");
            });
        }
    </script>
</body>
</html>
