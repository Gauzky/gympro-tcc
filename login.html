<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadeMax - Entrar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0b0c0e;
            --bg-card: #15151a;
            --bg-input: #1f2024;
            --primary: #b5c7eb;
            --primary-dark: #8da3cf;
            --primary-glow: rgba(181, 199, 235, 0.2);
            --text-main: #f2f5f7;
            --text-muted: #6b6e76;
            --border: rgba(255, 255, 255, 0.08);
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
        }

        /* LADO ESQUERDO (FORMULÁRIO) */
        .login-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.5s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        .logo svg { height: 36px; width: 36px; }
        .logo-text { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .logo-ade { color: #f2f5f7; }
        .logo-max { color: #b5c7eb; }

        h1 { font-size: 28px; font-weight: 700; margin-bottom: 30px; }

        .social-btns { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .social-btn {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 14px; border-radius: var(--radius-md);
            background: var(--bg-input); border: 1px solid var(--border);
            color: var(--text-main); font-size: 15px; font-weight: 500; cursor: pointer;
            transition: 0.2s;
        }
        .social-btn:hover { background: #2a2b30; }
        .social-btn i { font-size: 18px; }

        .divider { display: flex; align-items: center; text-align: center; color: var(--text-muted); margin: 20px 0; font-size: 13px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }

        .input-group { margin-bottom: 15px; position: relative; }
        .input-group input {
            width: 100%; background: var(--bg-input); border: 1px solid var(--border);
            padding: 16px; border-radius: var(--radius-md); color: var(--text-main);
            font-size: 15px; transition: 0.2s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn-primary {
            width: 100%; background: var(--primary); color: #0b0c0e; border: none;
            padding: 16px; border-radius: var(--radius-md); font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-primary:hover { background: var(--primary-dark); }

        .links { text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-muted); }
        .links a { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }

        .hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* LADO DIREITO (VITRINE DO APP) */
        .showcase-side {
            flex: 1.2;
            background: radial-gradient(circle at top right, #1a1c20, #0b0c0e);
            display: flex; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
            border-left: 1px solid var(--border);
        }
        
        .phone-mockup {
            width: 320px; height: 640px; background: var(--bg-main);
            border: 8px solid #2a2b30; border-radius: 45px; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative;
            padding: 25px 20px;
        }
        .phone-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .phone-header span { font-weight: 800; font-size: 18px; }
        .phone-header i { color: var(--primary); font-size: 20px; }
        
        .mock-card { background: var(--bg-card); padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
        .mock-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--primary); margin-bottom: 10px; }
        .mock-text { font-size: 20px; font-weight: 700; margin-bottom: 15px; }
        .mock-btn { height: 12px; width: 100px; background: var(--primary); border-radius: 4px; }
        
        .mock-exercise { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .mock-icon { width: 40px; height: 40px; background: var(--bg-input); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
        .mock-lines { flex: 1; }
        .mock-line { height: 8px; background: var(--bg-input); border-radius: 4px; margin-bottom: 5px; }
        .mock-line.short { width: 60%; }

        /* Responsivo: Esconde a vitrine no celular */
        @media (max-width: 900px) {
            .showcase-side { display: none; }
            .login-side { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- LADO ESQUERDO: LOGIN/CADASTRO -->
    <div class="login-side">
        <div class="form-wrapper">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.5714 12C20.5714 14.3457 19.6393 16.5942 17.9806 18.2529C16.3219 19.9116 14.0734 20.8437 11.7276 20.8437C9.38189 20.8437 7.13337 19.9116 5.47466 18.2529C3.81595 16.5942 2.88379 14.3457 2.88379 12" stroke="#b5c7eb" stroke-width="2.5" stroke-linecap="round"/><path d="M2.88379 12C2.88379 9.65428 3.81595 7.40576 5.47466 5.74705C7.13337 4.08834 9.38189 3.15619 11.7276 3.15619C14.0734 3.15619 16.3219 4.08834 17.9806 5.74705C19.6393 7.40576 20.5714 9.65428 20.5714 12" stroke="#f2f5f7" stroke-width="2.5" stroke-linecap="round"/><rect x="9.5" y="2" width="4" height="20" rx="2" fill="#b5c7eb"/></svg>
                <div class="logo-text"><span class="logo-ade">ACADE</span><span class="logo-max">MAX</span></div>
            </div>

            <!-- TELA DE LOGIN -->
            <div id="login-view">
                <h1>Entrar</h1>
                <div class="social-btns">
                    <button class="social-btn" onclick="loginWithGoogle()"><i class="fa-brands fa-google"></i> Entrar com o Google</button>
                    <button class="social-btn" onclick="alert('Login da Apple em desenvolvimento!')"><i class="fa-brands fa-apple"></i> Entrar com a Apple</button>
                </div>
                <div class="divider">ou</div>
                <form onsubmit="fazerLogin(event)">
                    <div class="input-group"><input type="email" placeholder="Email ou nome de usuário" required></div>
                    <div class="input-group"><input type="password" placeholder="Senha" required></div>
                    <button type="submit" class="btn-primary">Entrar</button>
                </form>
                <div class="links"><a onclick="alert('Função de recuperar senha em desenvolvimento.')">Esqueci minha senha</a> &nbsp;•&nbsp; Não tem uma conta? <a onclick="toggleAuthView('register')">Cadastre-se</a></div>
            </div>

            <!-- TELA DE CADASTRO -->
            <div id="register-view" class="hidden">
                <h1>Cadastre-se</h1>
                <div class="social-btns">
                    <button class="social-btn" onclick="loginWithGoogle()"><i class="fa-brands fa-google"></i> Cadastrar com o Google</button>
                </div>
                <div class="divider">ou</div>
                <form onsubmit="registrarUsuario(event)">
                    <div class="input-group"><input type="text" id="reg-name" placeholder="Nome completo" required></div>
                    <div class="input-group"><input type="email" id="reg-email" placeholder="Seu melhor e-mail" required></div>
                    <div class="input-group"><input type="date" id="reg-birthdate" required style="color: var(--text-muted);"></div>
                    <div class="input-group"><input type="password" id="reg-password" placeholder="Crie uma senha" required></div>
                    <div class="input-group"><input type="password" id="reg-confirm-password" placeholder="Confirme sua senha" required></div>
                    <button type="submit" class="btn-primary">Criar Conta</button>
                </form>
                <div class="links">Já tem uma conta? <a onclick="toggleAuthView('login')">Entrar</a></div>
            </div>
        </div>
    </div>

    <!-- LADO DIREITO: VITRINE DO APP (ESTILO HEVY) -->
    <div class="showcase-side">
        <div class="phone-mockup">
            <div class="phone-header">
                <span>Olá, Atleta 💪</span>
                <i class="fa-solid fa-bell"></i>
            </div>
            <div class="mock-card">
                <div class="mock-title">TREINO DE HOJE</div>
                <div class="mock-text">Treino A - Peito</div>
                <div class="mock-btn"></div>
            </div>
            <div class="mock-card">
                <div class="mock-title">EVOLUÇÃO</div>
                <div class="mock-exercise">
                    <div class="mock-icon"><i class="fa-solid fa-dumbbell"></i></div>
                    <div class="mock-lines">
                        <div class="mock-line"></div>
                        <div class="mock-line short"></div>
                    </div>
                </div>
                <div class="mock-exercise">
                    <div class="mock-icon"><i class="fa-solid fa-chart-line"></i></div>
                    <div class="mock-lines">
                        <div class="mock-line"></div>
                        <div class="mock-line short"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Google Identity (Escondido, mas funcional) -->
    <div id="g_id_onload" data-client_id="681505626161-vn9aiah8dd700qdsb4bolt9qanji49u1.apps.googleusercontent.com" data-callback="handleCredentialResponse" data-auto_prompt="false" style="display:none;"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        // ⚠️ CERTIFIQUE-SE QUE O LINK ABAIXO É O DO SEU RENDER! ⚠️
      const API = 'https://academax-backend.onrender.com/api';
        console.log("API configurada para:", API);

        function toggleAuthView(view) {
            if (view === 'register') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('register-view').classList.remove('hidden');
            } else {
                document.getElementById('login-view').classList.remove('hidden');
                document.getElementById('register-view').classList.add('hidden');
            }
        }

        // Força o clique no botão invisível do Google
        function loginWithGoogle() {
            alert("Abrindo login do Google... Se a janela não abrir, desative o bloqueador de pop-ups do navegador.");
            document.querySelector('.g_id_signin')?.click();
        }

        function handleCredentialResponse(response) {
            const data = JSON.parse(atob(response.credential.split('.')[1]));
            fetch(`${API}/google-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: data.name, email: data.email, picture: data.picture })
            })
            .then(res => res.json())
            .then(user => {
                if(user.error) { alert(user.error); return; }
                localStorage.setItem('gympro_user', JSON.stringify(user));
                window.location.href = 'index.html'; // LEVA PARA O APP
            })
            .catch(() => alert("Erro ao conectar no banco. O Render pode estar dormindo (demora 50s)."));
        }

        function fazerLogin(event) {
            event.preventDefault();
            const email = event.target.querySelector('input[type="email"]').value;
            const password = event.target.querySelector('input[type="password"]').value;

            fetch(`${API}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); return; }
                localStorage.setItem('gympro_user', JSON.stringify(data));
                window.location.href = 'index.html'; // LEVA PARA O APP
            })
            .catch(() => alert("Erro de conexão. Verifique se o link do Render está correto no código."));
        }

        function registrarUsuario(event) {
            event.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const birthdate = document.getElementById('reg-birthdate').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            if (password !== confirmPassword) { alert("As senhas não coincidem!"); return; }

            fetch(`${API}/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, birthdate })
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) { alert(data.error); return; }
                localStorage.setItem('gympro_user', JSON.stringify(data));
                window.location.href = 'index.html'; // LEVA PARA O APP
            })
            .catch(() => alert("Erro de conexão. Verifique se o link do Render está correto no código."));
        }
    </script>
</body>
</html>
